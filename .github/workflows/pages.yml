name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag
      - name: Build both apps for the web
        run: |
          pygbag --build --ume_block 0 --title "Fibonacci anyons" fibonacci
          pygbag --build --ume_block 0 --title "Toric code" toric_code
          mkdir -p _site
          cp -r fibonacci/build/web _site/fibonacci
          cp -r toric_code/build/web _site/toric_code
          cp web/index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
